name: Build and publish

# Runs whenever anything is pushed, and can also be started by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time. Do NOT cancel one that is already running:
# cancelling a deploy mid-flight can leave the github-pages environment
# holding its lock, and then every later run sits queued for ever.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out this site's own address
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install what the build needs
        run: pip install --quiet pillow reportlab

      - name: Build the site
        run: python3 build.py "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

    timeout-minutes: 20

  publish:
    needs: build
    runs-on: ubuntu-latest
    # If Pages is wedged, fail in 15 minutes instead of spinning for hours.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
