<!DOCTYPE html>
<!--
  Ajanta Tower in 3D - a model of the real facade, told as a story that plays itself.
  Long low block, four levels, sloping concrete fins with the rust stripe, tinted glass on top,
  the red drum over the entrance. Pure CSS 3D, no library. Shop colours come from the register.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajanta Tower — the story</title>
<meta name="author" content="Ajanta Services Association">
<meta name="description" content="Ajanta Tower, floor by floor, and what changes when every owner clears their maintenance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F5A524; --teal:#12A08A; --red:#D24A2C;
  --W:760px; --D:150px; --FH:60px; --RH:26px; --H:266px;
  --rust:#8E4A34; --conc:#D8D2C8; --conc2:#BEB6AA; --glass:#1D3D4A;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#050C14}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#fff;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.08}
.num{font-family:"Space Grotesk",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

#sky{position:fixed;inset:0;z-index:0;transition:background 2s ease;
  background:radial-gradient(120% 80% at 50% 6%,rgba(46,139,192,.3),transparent 60%),
    radial-gradient(90% 60% at 50% 106%,rgba(245,165,36,.16),transparent 58%),
    linear-gradient(180deg,#050C14,#0A1826 55%,#0E2434)}
#sky.warm{background:radial-gradient(120% 80% at 50% 6%,rgba(245,165,36,.36),transparent 60%),
    radial-gradient(90% 60% at 50% 106%,rgba(18,160,138,.3),transparent 58%),
    linear-gradient(180deg,#0B1622,#16324A 55%,#1E4A5E)}

#stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center;perspective:1500px;perspective-origin:50% 44%}
#world{transform-style:preserve-3d;transition:transform 2.8s cubic-bezier(.42,0,.25,1)}
#bldg{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d}

.face{position:absolute;transform-style:preserve-3d}
.front{width:var(--W);height:var(--H);left:0;top:0;transform:translateZ(calc(var(--D)/2));
  background:linear-gradient(180deg,#C9C2B6,#A79E92);border-radius:2px}
.back{width:var(--W);height:var(--H);left:0;top:0;transform:translateZ(calc(var(--D)/-2)) rotateY(180deg);
  background:#6E6A63}
.side{width:var(--D);height:var(--H);left:calc(var(--W) - var(--D)/2);top:0;
  transform:rotateY(90deg);background:linear-gradient(180deg,#2A4A58,#16303C)}
.side:before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--FH) + 10px);
  background:linear-gradient(180deg,#2E5A6B,#1B3C4A);border-bottom:3px solid var(--rust)}
.sideL{left:calc(var(--D)/-2);transform:rotateY(90deg)}
.roof{width:var(--W);height:var(--D);left:0;top:0;transform-origin:top;
  transform:rotateX(-90deg) translateZ(calc(var(--D)/-2)) translateY(calc(var(--D)/-2));
  background:linear-gradient(180deg,#8A857C,#6B665E)}

.flr{position:absolute;left:0;width:var(--W);height:var(--FH);transform-style:preserve-3d}
.slab{position:absolute;left:-8px;width:calc(var(--W) + 16px);height:13px;top:-7px;
  transform-style:preserve-3d;transform:translateZ(16px) rotateX(-16deg);
  background:linear-gradient(180deg,var(--conc),var(--conc2));border-radius:2px;
  box-shadow:0 8px 12px -6px rgba(0,0,0,.55)}
.slab:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:4px;background:var(--rust);opacity:.9}
.shops{position:absolute;left:12px;right:12px;top:14px;bottom:6px;display:flex;gap:3px;align-items:stretch}
.t{flex:1;border-radius:2px;background:rgba(30,42,52,.75);border:1px solid rgba(120,150,170,.35);
  transition:background .7s ease,border-color .7s ease,box-shadow .7s ease,transform .6s cubic-bezier(.2,1.6,.4,1)}
.t.z{background:rgba(210,74,44,.4);border-color:rgba(255,120,90,.85)}
.t.a{background:rgba(150,142,138,.28);border-color:rgba(200,192,188,.5)}
.t.p{background:rgba(245,165,36,.45);border-color:rgba(255,205,110,.95)}
.t.n{background:rgba(79,191,154,.4);border-color:rgba(124,224,196,.9)}
.t.g{background:rgba(30,200,165,.6);border-color:#5DF0CE;box-shadow:0 0 12px rgba(24,200,168,.8)}
.t.on{background:rgba(30,205,170,.72)!important;border-color:#6BF7D6!important;
  box-shadow:0 0 20px 4px rgba(24,210,175,.9)!important;transform:translateZ(7px)}
.t.beat{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scaleY(1)}14%{transform:scaleY(1.1) translateZ(6px)}28%{transform:scaleY(1)}42%{transform:scaleY(1.07) translateZ(4px)}56%{transform:scaleY(1)}}

.glassrow .shops{top:9px;bottom:4px;gap:5px}
.glassrow .t{background:linear-gradient(160deg,rgba(58,120,140,.85),rgba(18,52,66,.9));
  border-color:rgba(150,200,220,.35)}
.glassrow{background:linear-gradient(170deg,#33707F,#16333F)}
.mullion{position:absolute;left:12px;right:12px;top:9px;bottom:4px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(190,220,235,.22) 0 1px,transparent 1px 26px)}

.parapet{position:absolute;left:-8px;width:calc(var(--W) + 16px);height:var(--RH);top:0;
  background:linear-gradient(180deg,#9B9488,#7C766C);border-bottom:4px solid var(--rust)}
.drum{position:absolute;left:50%;top:calc(var(--RH) * -1 - 16px);width:120px;height:44px;
  transform:translateX(-50%);border-radius:60px 60px 0 0;
  background:linear-gradient(180deg,#A5502F,#7C3820);box-shadow:0 -4px 14px rgba(0,0,0,.4)}
.sign{position:absolute;left:50%;top:calc(var(--RH) * -1 + 4px);transform:translateX(-50%);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;letter-spacing:.22em;
  color:#FFF3E2;text-shadow:0 1px 4px rgba(0,0,0,.7);white-space:nowrap}
.flab{position:absolute;left:-40px;top:50%;transform:translateY(-50%);
  font-family:"Space Grotesk",monospace;font-size:11px;color:rgba(175,205,225,.7);letter-spacing:.06em}
.ground{position:absolute;left:50%;top:var(--H);width:1500px;height:620px;
  transform:translateX(-50%) rotateX(90deg);transform-origin:top center;
  background:radial-gradient(60% 70% at 50% 12%,rgba(245,165,36,.14),transparent 62%),
    linear-gradient(180deg,#1A2833,#0B141B);border-radius:8px}

#cap{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:22px 22px 30px;
  background:linear-gradient(180deg,rgba(5,12,20,0),rgba(5,12,20,.88) 42%,rgba(5,12,20,.97))}
#cap .in{max-width:600px;margin:0 auto}
#eb{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:block}
#ti{font-size:clamp(22px,6.4vw,36px);margin-top:9px}
#su{margin:11px 0 0;font-size:clamp(13.5px,3.7vw,16px);line-height:1.55;color:#A9C4D8;max-width:52ch}
#su b{color:#fff}
#bignum{font-family:"Space Grotesk",monospace;font-weight:700;letter-spacing:-.04em;
  font-size:clamp(30px,10vw,54px);line-height:1;margin-top:12px;color:#4FEFCB;display:none}
.fadein{animation:capIn .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes capIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

#bar{position:fixed;left:0;top:0;height:3px;z-index:5;width:100%;background:rgba(255,255,255,.1)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold))}
#chips{position:fixed;top:13px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:5px}
#chips i{width:16px;height:3px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .4s ease}
#chips i.on{background:var(--gold)}
#play{position:fixed;right:13px;top:26px;z-index:6;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:7px 14px;font:inherit;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#tapcue{position:fixed;left:0;right:0;top:30px;z-index:4;text-align:center;font-size:10.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);pointer-events:none;
  animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.25}50%{opacity:.75}}

#spinner{transform-style:preserve-3d;transition:transform 2.6s cubic-bezier(.42,0,.25,1)}
#spinner.spin360{animation:orb 9s cubic-bezier(.32,.08,.24,1) both}
@keyframes orb{from{transform:rotateY(-16deg)}to{transform:rotateY(344deg)}}
#stage{transition:opacity 1s ease}
#stage.dim #world{opacity:.14;transition:opacity 1s ease}
#pcard{position:fixed;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;
  opacity:0;transform:scale(.62);transition:opacity .9s ease,transform 1.3s cubic-bezier(.2,.8,.25,1);
  padding:0 14px 190px}
#pcard.on{opacity:1;transform:scale(1)}
.pbox{background:rgba(8,20,31,.94);border:1px solid rgba(130,170,200,.3);border-radius:18px;
  padding:16px 16px 13px;box-shadow:0 34px 70px -30px rgba(0,0,0,.9)}
.pbox .ph{font-family:"Space Grotesk",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(170,205,230,.7);margin-bottom:10px;text-align:center}
.prow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:4px 0}
.prow b{font-family:"Space Grotesk",monospace;font-size:10.5px;color:rgba(160,195,220,.75)}
.pgrid{display:flex;flex-wrap:wrap;gap:3px}
.q{width:15px;height:15px;border-radius:3px;border:1.5px solid rgba(120,150,170,.35);background:rgba(30,42,52,.75);
  transition:background .6s ease,border-color .6s ease,box-shadow .6s ease,transform .6s cubic-bezier(.2,1.6,.4,1)}
.q.z{background:rgba(210,74,44,.42);border-color:rgba(255,120,90,.85)}
.q.a{background:rgba(150,142,138,.28);border-color:rgba(200,192,188,.5)}
.q.p{background:rgba(245,165,36,.45);border-color:rgba(255,205,110,.95)}
.q.n{background:rgba(79,191,154,.4);border-color:rgba(124,224,196,.9)}
.q.g{background:rgba(30,200,165,.6);border-color:#5DF0CE;box-shadow:0 0 10px rgba(24,200,168,.8)}
.q.wide{width:42px}
.q.on{background:rgba(30,205,170,.75)!important;border-color:#6BF7D6!important;
  box-shadow:0 0 16px 3px rgba(24,210,175,.9)!important;transform:scale(1.14)}
#front.party .sign{text-shadow:0 0 6px rgba(255,220,160,.9),0 0 22px rgba(255,180,80,.8)}
#front.party .drum{box-shadow:0 -4px 22px rgba(245,140,60,.75)}
#front.party .glassrow .t{box-shadow:0 0 14px rgba(120,230,205,.5)}
@media(prefers-reduced-motion:reduce){#world,#spinner,.t,.q{transition:none!important;animation:none!important}.t.beat{animation:none}#tapcue{animation:none}}
</style>
</head>
<body>

<div id="sky"></div>
<div id="stage"><div id="world"><div id="spinner">
  <div class="ground"></div>
  <div id="bldg">
    <div class="face back"></div>
    <div class="face side sideL"></div>
    <div class="face side"></div>
    <div class="face roof"></div>
    <div class="face front" id="front"></div>
  </div>
</div></div></div>

<div id="bar"><i id="barFill"></i></div>
<div id="chips"></div>
<button id="play">Pause</button>
<div id="tapcue">Tap to skip ahead</div>

<div id="cap"><div class="in" id="capIn">
  <span id="eb"></span>
  <h2 id="ti"></h2>
  <div id="bignum" class="num"></div>
  <p id="su"></p>
</div></div>

<script>
const S = {"tiles": {"LGF": [["a", 0], ["z", 0], ["z", 0], ["a", 0], ["z", 0], ["g", 0], ["a", 0], ["z", 0], ["z", 0], ["z", 0], ["z", 0], ["z", 0], ["z", 0], ["z", 1], ["z", 1], ["z", 1], ["z", 1], ["a", 0], ["a", 0], ["z", 0], ["z", 0], ["z", 0], ["z", 0], ["a", 0], ["z", 0], ["a", 0], ["a", 0], ["g", 1], ["g", 1], ["z", 0], ["z", 0], ["a", 0], ["z", 0], ["z", 0], ["a", 0], ["a", 0], ["a", 0], ["a", 0], ["a", 0]], "UGF": [["a", 0], ["g", 0], ["g", 0], ["g", 0], ["g", 0], ["g", 0], ["g", 0], ["z", 0], ["g", 0], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["z", 0], ["z", 0], ["z", 1], ["z", 1], ["z", 1], ["z", 0], ["a", 0], ["a", 0], ["a", 0], ["z", 1], ["a", 0], ["a", 0], ["g", 1], ["g", 1], ["g", 1], ["z", 0], ["g", 1], ["g", 1], ["g", 1], ["g", 1], ["g", 1]], "FF": [["z", 0], ["g", 0], ["g", 0], ["g", 0], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["a", 1], ["z", 1], ["z", 1], ["z", 0], ["a", 0], ["a", 0], ["z", 1], ["z", 1], ["z", 1], ["z", 0], ["z", 0], ["z", 1], ["z", 1], ["z", 1], ["z", 1], ["z", 1], ["z", 1], ["z", 0], ["p", 1], ["p", 1], ["p", 1], ["p", 1], ["p", 1], ["p", 1], ["g", 1], ["g", 1], ["a", 0], ["z", 0], ["z", 0], ["g", 1]], "SF": [["p", 1], ["g", 1]]}, "owners": 54, "bands": {"g": 8, "p": 2, "a": 16, "z": 28}, "demand": 962576, "paid": 484690, "spent": 440629, "hold": 44061, "bills": 170000, "short": 125939, "pending": 478688, "majN": 10, "majPending": 221888, "majShare": 58.9, "monthly": 73438, "area": 40111, "afterMaj": 706578, "surplus": 351947, "months": 4.8};
const inr = n => "\u20B9" + Math.round(n).toLocaleString("en-IN");
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const world = document.getElementById("world");
const spinner = document.getElementById("spinner");
const stage = document.getElementById("stage");
const front = document.getElementById("front");

const FH = 60, RH = 26;
const ORDER = ["SF", "FF", "UGF", "LGF"];
let html = '<div class="parapet"><div class="drum"></div><div class="sign">AJANTA TOWER</div></div>';
ORDER.forEach(function(f, k){
  const glass = f === "SF";
  html += '<div class="flr' + (glass ? " glassrow" : "") + '" data-f="' + f + '" style="top:' + (RH + k * FH) + 'px">' +
    '<div class="slab"></div><span class="flab">' + f + '</span>' +
    '<div class="shops">' +
    (S.tiles[f] || []).map(function(t){
      return '<span class="t ' + t[0] + '" data-m="' + (t[1] ? "1" : "0") + '"></span>';
    }).join("") +
    '</div>' + (glass ? '<div class="mullion"></div>' : '') + '</div>';
});
front.innerHTML = html;

const allT = [].slice.call(front.querySelectorAll(".t"));

const pcard = document.createElement("div");
pcard.id = "pcard";
let ph = '<div class="pbox"><div class="ph">Ajanta Tower — the map</div>';
ORDER.forEach(function(f){
  ph += '<div class="prow"><b>' + f + '</b><div class="pgrid">' +
    (S.tiles[f] || []).map(function(t){
      return '<span class="q ' + t[0] + (f === "SF" ? " wide" : "") + '"></span>';
    }).join("") + '</div></div>';
});
ph += '</div>';
pcard.innerHTML = ph;
document.body.appendChild(pcard);
const planT = [].slice.call(pcard.querySelectorAll(".q"));

function planShow(on){
  pcard.classList.toggle("on", !!on);
  stage.classList.toggle("dim", !!on);
}
function greenBoth(step){
  let n = 0;
  allT.forEach(function(t, i){
    if (t.classList.contains("on")) return;
    const d = 160 + n * (step || 16); n++;
    setTimeout(function(){ t.classList.add("on"); if (planT[i]) planT[i].classList.add("on"); }, d);
  });
}

function fit(){
  const w = Math.min(window.innerWidth - 24, 1000);
  const s = Math.max(0.34, Math.min(1, w / 900));
  world.style.setProperty("--fit", s);
  view.last && view.apply();
}
function view(rx, ry, z, y){
  view.last = [rx, ry, z, y || 0];
  view.apply();
}
view.apply = function(){
  const v = view.last, s = getComputedStyle(world).getPropertyValue("--fit") || 1;
  world.style.transform = "scale(" + parseFloat(s) + ") translateY(" + v[3] + "px) rotateX(" + v[0] +
    "deg) rotateY(" + v[1] + "deg) translateZ(" + v[2] + "px)";
};
window.addEventListener("resize", fit);

function greenify(list, step){
  list.forEach(function(t, i){ setTimeout(function(){ t.classList.add("on"); }, 140 + i * (step || 20)); });
}
const eb = document.getElementById("eb"), ti = document.getElementById("ti"),
      su = document.getElementById("su"), bn = document.getElementById("bignum"),
      capIn = document.getElementById("capIn");
function countTo(el, to){
  if (REDUCED){ el.textContent = inr(to); return; }
  const t0 = performance.now(), dur = 1600;
  const step = function(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = inr(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function say(e, t, s, big){
  eb.textContent = e; ti.innerHTML = t; su.innerHTML = s || "";
  if (big){ bn.style.display = "block"; bn.textContent = ""; countTo(bn, big); }
  else bn.style.display = "none";
  capIn.classList.remove("fadein"); void capIn.offsetWidth; capIn.classList.add("fadein");
}

const SCENES = [
  { ms: 9600, go: function(){
      planShow(false);
      front.classList.remove("party");
      allT.forEach(function(t){ t.classList.remove("on", "beat"); });
      planT.forEach(function(t){ t.classList.remove("on"); });
      view(8, 0, -280, 10);
      spinner.classList.add("spin360");
      say("Ajanta Services Association", "Ajanta Tower, all the way around.",
        "Four levels. <b>119 shops.</b> <b>" + S.owners + " owners.</b> One address on Kanpur Road. " +
        "The story plays by itself — every figure comes from the open register.");
    }},
  { ms: 8200, go: function(){
      spinner.classList.remove("spin360");
      view(4, -8, -160, 0);
      setTimeout(function(){ planShow(true); }, 500);
      say("Zoom in", "This is the real map of the building.",
        "Every block is one shop, in its true state today. <b>" + S.bands.z + "</b> have paid nothing, " +
        "<b>" + S.bands.a + "</b> are a quarter or more behind, <b>" + S.bands.p + "</b> are part paid, " +
        "only <b>" + S.bands.g + "</b> are clear.");
    }},
  { ms: 8200, go: function(){
      planShow(true);
      say("The gap", "Half the bill is standing outside.",
        "Collected <b>" + inr(S.paid) + "</b>. Spent on the building <b>" + inr(S.spent) + "</b>. " +
        "Bills raised and waiting: <b>" + inr(S.bills) + "</b>. Short today: <b>" + inr(S.short) + "</b>.");
    }},
  { ms: 10500, go: function(){
      planShow(true);
      greenBoth(15);
      say("Watch", "Red to green, shop by shop.",
        "This is nothing more than every owner clearing what is already theirs. " +
        "The ten biggest holders alone carry <b>" + S.majShare + "%</b> of it.", S.demand);
    }},
  { ms: 8800, go: function(){
      planShow(false);
      document.getElementById("sky").classList.add("warm");
      view(9, -26, -150, 10);
      say("Zoom out", "And this is the building it makes.",
        "Every shutter clear. Every floor lit. <b>" + inr(S.demand) + "</b> collected — " +
        "every raised bill paid the same week.");
    }},
  { ms: 9200, go: function(){
      front.classList.add("party");
      view(14, 22, -80, 10);
      say("The building's good days", "Then the tower stops surviving and starts improving.",
        "<b>" + inr(S.surplus) + "</b> left in the association's hands — <b>" + S.months +
        " months</b> of running cost, banked. Paint, lighting, signage, security, " +
        "a lift under contract instead of under repair. The address starts gaining value again.");
    }},
  { ms: 13000, go: function(){
      view(5, -20, 10, -10);
      say("Your turn", "The tower is worth what we decide it is worth.",
        "<b>Clear your side. Watch your shutter turn green.</b><br>" +
        "<span style='color:#7E9DB4;font-size:12px;letter-spacing:.12em;text-transform:uppercase'>Ajanta Services Association &middot; Open accounts</span>");
    }}
];

const chips = document.getElementById("chips");
SCENES.forEach(function(){ chips.appendChild(document.createElement("i")); });
const dots = [].slice.call(chips.querySelectorAll("i"));
const fill = document.getElementById("barFill");
const playBtn = document.getElementById("play");
let idx = -1, timer = 0, raf = 0, started = 0, paused = false;

function run(i){
  idx = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  dots.forEach(function(d, k){ d.classList.toggle("on", k === idx); });
  if (idx === 0) document.getElementById("sky").classList.remove("warm");
  SCENES[idx].go();
  started = performance.now();
  clearTimeout(timer);
  if (!paused) timer = setTimeout(function(){ run(idx + 1); }, SCENES[idx].ms);
  tick();
}
function tick(){
  cancelAnimationFrame(raf);
  const loop = function(t){
    const k = Math.min(1, (t - started) / SCENES[idx].ms);
    fill.style.width = (k * 100) + "%";
    if (k < 1 && !paused) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
playBtn.addEventListener("click", function(ev){
  ev.stopPropagation();
  paused = !paused;
  playBtn.textContent = paused ? "Play" : "Pause";
  if (paused) clearTimeout(timer);
  else { started = performance.now(); timer = setTimeout(function(){ run(idx + 1); }, SCENES[idx].ms); tick(); }
});
document.body.addEventListener("click", function(){ if (!paused) run(idx + 1); });
fit();
setTimeout(function(){ run(0); }, 350);
setTimeout(function(){ document.getElementById("tapcue").style.display = "none"; }, 9000);
</script>
</body>
</html>
