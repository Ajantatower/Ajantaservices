<!DOCTYPE html>
<!--
  Ajanta Tower - the accounts, played as a short film.
  Self-advancing scenes, animated figures. No library, no build step.
  Every number is computed from the same register the accounts page uses.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajanta Tower — the accounts, in two minutes</title>
<meta name="author" content="Ajanta Services Association">
<meta name="description" content="Six months of Ajanta Tower's maintenance money, told as a short animated film.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12293F; --soft:#5B7488; --line:#DDE7EF; --bg:#F6FAFD;
  --gold:#F5A524; --teal:#12A08A; --coral:#EF6C4D; --sky:#2E8BC0; --red:#D24A2C;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#050C14;color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.1}
.num{font-family:"Space Grotesk",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

#bgfx{position:fixed;inset:0;z-index:0;transition:background 1.6s ease;
  background:radial-gradient(110% 70% at 50% 0%,rgba(46,139,192,.26),transparent 60%),
    linear-gradient(180deg,#050C14,#0B1B2A 60%,#0E2434)}
#bgfx.g{background:radial-gradient(110% 70% at 50% 0%,rgba(18,160,138,.3),transparent 60%),
    linear-gradient(180deg,#07131C,#0E2C33 60%,#124A48)}
#bgfx.r{background:radial-gradient(110% 70% at 50% 0%,rgba(210,74,44,.28),transparent 60%),
    linear-gradient(180deg,#0C0A0F,#241318 60%,#33161A)}

#scene{position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:56px 20px 120px}
.card{width:100%;max-width:560px}
.eb{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block}
.card h2{font-size:clamp(25px,7vw,40px);margin-top:10px}
.card .sub{margin:12px 0 0;font-size:clamp(13.5px,3.8vw,16px);line-height:1.6;color:#A9C4D8;max-width:52ch}
.card .sub b{color:#fff}
.huge{font-family:"Space Grotesk",monospace;font-weight:700;letter-spacing:-.045em;
  font-size:clamp(44px,15vw,86px);line-height:1;margin-top:16px;color:#4FEFCB}
.huge.warn{color:#FF8A66}
.tiny{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7E9DB4;margin-top:8px}

.bars{margin-top:22px;display:grid;gap:11px}
.brow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center}
.brow .l{font-size:12.5px;font-weight:700;color:#C6DAEA}
.brow .track{height:14px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.brow .track i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.3,1)}
.brow .v{font-family:"Space Grotesk",monospace;font-size:12.5px;font-weight:700;white-space:nowrap;color:#DFF0FA}

.cols{display:flex;align-items:flex-end;gap:7px;height:170px;margin-top:26px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.col i{display:block;width:100%;border-radius:6px 6px 2px 2px;height:0;
  background:linear-gradient(180deg,#3FD6B4,#12A08A);transition:height 1.2s cubic-bezier(.2,.8,.3,1)}
.col.hot i{background:linear-gradient(180deg,#FFC24A,#EF6C4D)}
.col b{font-family:"Space Grotesk",monospace;font-size:9.5px;color:#9BB8CC;font-weight:700}
.col .cv{font-family:"Space Grotesk",monospace;font-size:9px;color:#DFF0FA;opacity:0;transition:opacity .6s ease .8s}
.play .col .cv{opacity:1}

.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.dcard{border-radius:16px;padding:16px;border:1.5px solid}
.dcard .k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dcard .dv{font-family:"Space Grotesk",monospace;font-weight:700;font-size:clamp(19px,5.6vw,26px);margin-top:6px}
.dcard.ok{background:rgba(18,160,138,.14);border-color:rgba(63,224,188,.5)}
.dcard.ok .k{color:#7CE0C4}
.dcard.bad{background:rgba(210,74,44,.16);border-color:rgba(255,138,102,.55)}
.dcard.bad .k{color:#FFAD92}

.rows{margin-top:22px;display:grid;gap:9px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:12px 14px;
  opacity:0;transform:translateX(-18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
.play .rrow{opacity:1;transform:none}
.rrow:nth-child(2){transition-delay:.18s}
.rrow:nth-child(3){transition-delay:.36s}
.rrow .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--gold);
  color:#3A2503;font-family:"Space Grotesk",monospace;font-size:12px;font-weight:700}
.rrow .t{font-size:13px;font-weight:600;line-height:1.3}
.rrow .t small{display:block;font-size:11px;font-weight:500;color:#93B0C4;margin-top:2px}
.rrow .a{font-family:"Space Grotesk",monospace;font-weight:700;font-size:13.5px;white-space:nowrap}

.fadein{animation:fin .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes fin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

#bar{position:fixed;left:0;top:0;height:3px;z-index:5;width:100%;background:rgba(255,255,255,.1)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold))}
#chips{position:fixed;top:13px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:5px}
#chips i{width:16px;height:3px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .4s ease}
#chips i.on{background:var(--gold)}
#play{position:fixed;right:13px;top:26px;z-index:6;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:7px 14px;font:inherit;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#tapcue{position:fixed;left:0;right:0;top:30px;z-index:4;text-align:center;font-size:10.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);pointer-events:none;
  animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.25}50%{opacity:.75}}
@media(prefers-reduced-motion:reduce){
  .brow .track i,.col i,.rrow{transition:none!important}
  .rrow{opacity:1;transform:none}
  #tapcue{animation:none}
}
</style>
</head>
<body>

<div id="bgfx"></div>
<div id="scene"><div class="card" id="card"></div></div>

<div id="bar"><i id="barFill"></i></div>
<div id="chips"></div>
<button id="play">Pause</button>
<div id="tapcue">Tap to skip ahead</div>

<script>
const F = {"paid": 484690, "spent": 440629, "hold": 44061, "payers": 26, "npay": 43, "nexp": 39, "cat": {"Repairs": 37530, "Cleaning": 342939, "Electricity": 52800, "Admin": 7360}, "mon": [["2026-01", 11540], ["2026-02", 40000], ["2026-03", 120930], ["2026-04", 43900], ["2026-05", 56257], ["2026-06", 64412], ["2026-07", 52590], ["2026-08", 46000], ["none", 5000]], "top": [["Sun Star Housekeeping (Surendra Kumar)", 60000, "2026-03-23"], ["Electricity Bill", 50000, "2026-03-25"], ["Sun Star Housekeeping", 49200, "2026-06-18"]], "bills": 170000, "short": 125939, "pending": 478688, "behind": 46, "demand": 962576, "surplus": 351947, "per100": {"Repairs": 9, "Cleaning": 78, "Electricity": 12, "Admin": 2}};
const inr = n => "\u20B9" + Math.round(n).toLocaleString("en-IN");
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const card = document.getElementById("card");
const bg = document.getElementById("bgfx");

function countTo(el, to){
  if (REDUCED){ el.textContent = inr(to); return; }
  const t0 = performance.now(), dur = 1500;
  const step = function(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = inr(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function show(html, mood){
  bg.className = mood || "";
  card.innerHTML = html;
  card.classList.remove("fadein"); void card.offsetWidth; card.classList.add("fadein");
  setTimeout(function(){ card.classList.add("play"); }, 120);
  const big = card.querySelector("[data-count]");
  if (big) countTo(big, +big.dataset.count);
  card.querySelectorAll("[data-w]").forEach(function(el){
    setTimeout(function(){ el.style.width = el.dataset.w + "%"; }, 260);
  });
  card.querySelectorAll("[data-h]").forEach(function(el){
    setTimeout(function(){ el.style.height = el.dataset.h + "%"; }, 260);
  });
}

const CATC = {Cleaning:"linear-gradient(90deg,#3FD6B4,#12A08A)", Electricity:"linear-gradient(90deg,#FFD98A,#F5A524)",
  Repairs:"linear-gradient(90deg,#FFA88C,#EF6C4D)", Admin:"linear-gradient(90deg,#8FC4E8,#2E8BC0)"};

const SCENES = [
  { ms: 7000, mood:"", html: function(){
      return '<span class="eb">Ajanta Services Association</span>' +
        '<h2>Six months of the building\u2019s money.<br>Two minutes.</h2>' +
        '<p class="sub">1 January to 31 July 2026. Every figure in this film comes from the open register — ' +
        'the same one you can read line by line on the accounts page.</p>';
    }},
  { ms: 7600, mood:"g", html: function(){
      return '<span class="eb">Money in</span>' +
        '<h2>What came in.</h2>' +
        '<div class="huge num" data-count="' + F.paid + '">\u20B90</div>' +
        '<div class="tiny">' + F.npay + ' payments \u00B7 from ' + F.payers + ' owners</div>' +
        '<p class="sub">That is maintenance received in the association\u2019s account across the six months. ' +
        '<b>Every payment is listed by name and date.</b></p>';
    }},
  { ms: 8600, mood:"", html: function(){
      const order = ["Cleaning","Electricity","Repairs","Admin"];
      const mx = Math.max.apply(null, order.map(function(c){ return F.cat[c] || 0; }));
      return '<span class="eb">Money out</span>' +
        '<h2>Where it went.</h2>' +
        '<div class="bars">' + order.map(function(c){
          const v = F.cat[c] || 0;
          return '<div class="brow"><span class="l">' + c + '</span>' +
            '<span class="track"><i data-w="' + (v / mx * 100).toFixed(1) + '" style="background:' + CATC[c] + '"></i></span>' +
            '<span class="v num">' + inr(v) + '</span></div>';
        }).join("") + '</div>' +
        '<p class="sub">Total spent on the building: <b>' + inr(F.spent) + '</b>. ' +
        'Out of every \u20B9100, <b>\u20B9' + F.per100.Cleaning + '</b> keeps it clean, ' +
        '<b>\u20B9' + F.per100.Electricity + '</b> keeps it lit.</p>';
    }},
  { ms: 8600, mood:"", html: function(){
      const mon = F.mon.filter(function(m){ return m[0] !== "none"; });
      const mx = Math.max.apply(null, mon.map(function(m){ return m[1]; }));
      return '<span class="eb">Month by month</span>' +
        '<h2>The shape of the year.</h2>' +
        '<div class="cols">' + mon.map(function(m){
          const hot = m[1] === mx;
          return '<div class="col' + (hot ? " hot" : "") + '">' +
            '<span class="cv num">' + "\u20B9" + Math.round(m[1]/1000) + 'k</span>' +
            '<i data-h="' + (m[1] / mx * 100).toFixed(1) + '"></i>' +
            '<b>' + MON[+m[0].slice(5) - 1] + '</b></div>';
        }).join("") + '</div>' +
        '<p class="sub">March is the heavy month — the big electricity bill and a housekeeping settlement landed together. ' +
        'The rest of the year runs near <b>\u20B966,000 a month</b>.</p>';
    }},
  { ms: 7600, mood:"", html: function(){
      return '<span class="eb">The biggest bills</span>' +
        '<h2>Three lines carry a third of it.</h2>' +
        '<div class="rows">' + F.top.map(function(t, i){
          const d = t[2] ? new Date(t[2]) : null;
          return '<div class="rrow"><span class="n">' + (i + 1) + '</span>' +
            '<span class="t">' + t[0] + '<small>' + (d ? d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear() : "") + '</small></span>' +
            '<span class="a num">' + inr(t[1]) + '</span></div>';
        }).join("") + '</div>' +
        '<p class="sub">Nothing here is hidden in a lump sum — <b>all ' + F.nexp + ' expense lines</b> sit in the register with dates.</p>';
    }},
  { ms: 8600, mood:"r", html: function(){
      return '<span class="eb">The squeeze</span>' +
        '<h2>What is left, against what is due.</h2>' +
        '<div class="duel">' +
        '<div class="dcard ok"><div class="k">In the account</div><div class="dv num">' + inr(F.hold) + '</div></div>' +
        '<div class="dcard bad"><div class="k">Bills on the table</div><div class="dv num">' + inr(F.bills) + '</div></div>' +
        '</div>' +
        '<div class="huge warn num" data-count="' + F.short + '">\u20B90</div>' +
        '<div class="tiny">Short, today</div>' +
        '<p class="sub">The electricity bill and the housekeeping dues are already raised. ' +
        'What is in hand does not cover them.</p>';
    }},
  { ms: 8600, mood:"g", html: function(){
      return '<span class="eb">The fix</span>' +
        '<h2>The money already exists. It is just standing outside.</h2>' +
        '<div class="huge num" data-count="' + F.pending + '">\u20B90</div>' +
        '<div class="tiny">Pending from ' + F.behind + ' owners</div>' +
        '<p class="sub">If it comes in, every raised bill is paid the same week — and <b>' + inr(F.surplus) + '</b> ' +
        'stays banked as the building\u2019s own cushion. No fund raising. No loans. Just what is already owed.</p>';
    }},
  { ms: 12000, mood:"g", html: function(){
      return '<span class="eb">Open accounts</span>' +
        '<h2>Every rupee has a name and a date.</h2>' +
        '<p class="sub"><b>Check your own shop on the accounts page.</b> Tap your unit, read your balance, ' +
        'see exactly what your money did.</p>' +
        '<p class="sub" style="color:#7E9DB4;font-size:12px;letter-spacing:.12em;text-transform:uppercase">' +
        'Ajanta Services Association \u00B7 Kanpur Road, Lucknow</p>';
    }}
];

const chips = document.getElementById("chips");
SCENES.forEach(function(){ chips.appendChild(document.createElement("i")); });
const dots = [].slice.call(chips.querySelectorAll("i"));
const fill = document.getElementById("barFill");
const playBtn = document.getElementById("play");
let idx = -1, timer = 0, raf = 0, started = 0, paused = false;

function run(i){
  idx = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  dots.forEach(function(d, k){ d.classList.toggle("on", k === idx); });
  show(SCENES[idx].html(), SCENES[idx].mood);
  started = performance.now();
  clearTimeout(timer);
  if (!paused) timer = setTimeout(function(){ run(idx + 1); }, SCENES[idx].ms);
  tick();
}
function tick(){
  cancelAnimationFrame(raf);
  const loop = function(t){
    const k = Math.min(1, (t - started) / SCENES[idx].ms);
    fill.style.width = (k * 100) + "%";
    if (k < 1 && !paused) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
playBtn.addEventListener("click", function(ev){
  ev.stopPropagation();
  paused = !paused;
  playBtn.textContent = paused ? "Play" : "Pause";
  if (paused) clearTimeout(timer);
  else { started = performance.now(); timer = setTimeout(function(){ run(idx + 1); }, SCENES[idx].ms); tick(); }
});
document.body.addEventListener("click", function(){ if (!paused) run(idx + 1); });
setTimeout(function(){ run(0); }, 300);
setTimeout(function(){ document.getElementById("tapcue").style.display = "none"; }, 9000);
</script>
</body>
</html>
